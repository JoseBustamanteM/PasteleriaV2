<div class="min-h-screen flex items-center justify-center bg-gris-claro px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-[28px] shadow-suave">

    <div class="text-center mb-8">
      <span class="text-4xl" role="img" aria-label="Pastel">🍰</span>
      <h2 class="mt-4 text-2xl font-black text-cacao-800">¡Bienvenido al POS!</h2>
      <p class="text-sm font-semibold text-cacao-500 mt-1">Ingresa tus credenciales para administrar tus ventas</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-5 px-4 py-3 bg-frambuesa-50 text-frambuesa-700 text-sm font-bold rounded-2xl">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <div>
        <label for="email" class="etiqueta">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@pasteleria.com"
          class="campo"
        />
      </div>

      <div>
        <label for="password" class="etiqueta">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="campo"
        />
      </div>

      <button
        type="submit"
        [disabled]="authForm.invalid || isLoading()"
        class="btn-primario w-full min-h-[52px] text-base mt-2"
      >
        @if (isLoading()) {
          <span class="animate-spin inline-block w-4 h-4 border-2 border-nieve border-t-transparent rounded-full"></span>
          Verificando cuenta...
        } @else {
          Iniciar Sesión
        }
      </button>

    </form>

  </div>
</div>
