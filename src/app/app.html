@if (!isAuthRoute()) {
  <!-- Contenedor Principal: Ocupa toda la pantalla y es el padre de todo -->
  <div class="relative flex flex-col h-screen bg-cacao-50 overflow-hidden">

    <!-- CONTENIDO DINÁMICO: Cada pantalla trae su propio encabezado.
         pb-28 deja espacio para que la cápsula de navegación no tape nada. -->
    <div class="flex-1 overflow-y-auto pb-28">
      <div class="max-w-3xl mx-auto w-full min-h-full flex flex-col">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN FLOTANTE -->
    <nav aria-label="Navegación principal"
         class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-32px)] max-w-md h-[68px] bg-cacao-800 rounded-full shadow-flotante z-50 grid grid-cols-5 items-center px-1.5"
         style="margin-bottom: env(safe-area-inset-bottom)">

      @for (item of navIzquierda; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="!bg-frambuesa-100 !text-frambuesa-700"
           [attr.aria-label]="item.nombre" [title]="item.nombre"
           class="h-[52px] mx-1 rounded-full flex items-center justify-center text-cacao-200 hover:text-white transition-colors">
          <ng-container *ngTemplateOutlet="icono; context: { $implicit: item.icono }"></ng-container>
        </a>
      }

      <a routerLink="/pos" aria-label="Nueva venta" title="Nueva venta"
         class="h-[52px] mx-0.5 rounded-full bg-frambuesa-600 text-white flex items-center justify-center hover:bg-frambuesa-700 active:scale-95 transition-all">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </a>

      @for (item of navDerecha; track item.ruta) {
        <a [routerLink]="item.ruta" routerLinkActive="!bg-frambuesa-100 !text-frambuesa-700"
           [attr.aria-label]="item.nombre" [title]="item.nombre"
           class="h-[52px] mx-1 rounded-full flex items-center justify-center text-cacao-200 hover:text-white transition-colors">
          <ng-container *ngTemplateOutlet="icono; context: { $implicit: item.icono }"></ng-container>
        </a>
      }
    </nav>
  </div>
} @else {
  <router-outlet></router-outlet>
}

<ng-template #icono let-nombre>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    @switch (nombre) {
      @case ('inicio') {
        <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
      }
      @case ('balance') {
        <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>
      }
      @case ('compras') {
        <circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 11.4a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/>
      }
      @case ('gestion') {
        <path d="M4 6h3"/><path d="M11 6h9"/><circle cx="9" cy="6" r="2"/>
        <path d="M4 12h9"/><path d="M17 12h3"/><circle cx="15" cy="12" r="2"/>
        <path d="M4 18h2"/><path d="M10 18h10"/><circle cx="8" cy="18" r="2"/>
      }
    }
  </svg>
</ng-template>
